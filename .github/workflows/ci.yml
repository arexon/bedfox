name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    ready:
        name: ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        steps:
            - uses: actions/checkout@v7

            - uses: voidzero-dev/setup-vp@v1.21.1
              with:
                  cache: true

            - run: vp run ready
            - run: git diff --exit-code
