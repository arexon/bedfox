name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6.1.0

            - uses: actions/setup-node@v7
              with:
                  node-version: 26
                  cache: pnpm

            - run: pnpm install --frozen-lockfile
            - run: pnpm exec oxfmt --check
            - run: pnpm lint --deny-warnings

    test:
        name: test (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6.1.0

            - uses: actions/setup-node@v7
              with:
                  node-version: 26
                  cache: pnpm

            - run: pnpm install --frozen-lockfile
            - run: pnpm build
            - run: pnpm test
            - run: git diff --exit-code
