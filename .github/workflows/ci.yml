name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: voidzero-dev/setup-vp@v1.22.0
              with:
                  node-version: 26
                  cache: true
                  run-install: |
                      - cwd: .
                        args: ["--frozen-lockfile"]

            - run: vp check --deny-warnings

    test:
        name: test (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        steps:
            - uses: actions/checkout@v7

            - uses: voidzero-dev/setup-vp@v1.22.0
              with:
                  node-version: 26
                  cache: true
                  run-install: |
                      - cwd: .
                        args: ["--frozen-lockfile"]

            - run: vp run build
            - run: vp run test
            - run: git diff --exit-code
